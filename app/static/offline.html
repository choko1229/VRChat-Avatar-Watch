<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンテナンス中 - VRChat Avatar Watch</title>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --text: #000000;
    --muted: rgba(60, 60, 67, 0.6);
    --brand: #007aff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --radius-lg: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #ffffff;
      --muted: rgba(235, 235, 245, 0.6);
      --brand: #0a84ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 32px 28px;
    text-align: center;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px solid rgba(120, 120, 128, 0.24);
    border-top-color: var(--brand);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  button {
    appearance: none;
    border: none;
    border-radius: 12px;
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 11px 22px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>メンテナンス中です</h1>
    <p>サーバーを再起動しています。しばらくすると自動的に元のページに戻ります。</p>
    <button type="button" onclick="location.reload()">今すぐ再読み込み</button>
  </div>
  <script>
    // Poll the actual page (not this cached fallback) and reload
    // automatically as soon as the origin responds normally again.
    function checkIfBackOnline() {
      fetch(location.href, { cache: "no-store", credentials: "same-origin" })
        .then((response) => {
          if (response.status < 500) location.reload();
        })
        .catch(() => {});
    }
    setInterval(checkIfBackOnline, 4000);
  </script>
</body>
</html>
