{% if avatars %}
<ul class="suggest-list">
  {% for avatar in avatars %}
  <li>
    {% if mode == "link" %}
    <a class="suggest-item" href="/avatars/{{ avatar.slug }}">{{ avatar.name }}</a>
    {% else %}
    <button type="button" class="suggest-item" data-avatar-name="{{ avatar.name }}">{{ avatar.name }}</button>
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% elif hint %}
<div class="suggest-empty">「{{ hint }}」に一致するアバターが見つかりません</div>
{% endif %}
